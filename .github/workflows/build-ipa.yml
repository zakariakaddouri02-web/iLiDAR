
name: Build iLiDAR IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          if [ -f Podfile.lock ]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Verify Project
        run: |
          echo "=== PROJECT FILES ==="
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

          echo "=== WORKSPACE SCHEMES ==="
          xcodebuild -list -workspace iLiDAR.xcworkspace

          echo "=== PROJECT TARGETS ==="
          xcodebuild -list -project iLiDAR.xcodeproj

      - name: Archive iLiDAR App
        run: |
          xcodebuild archive \
            -workspace iLiDAR.xcworkspace \
            -scheme iLiDAR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/iLiDAR.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify Application
        run: |
          ARCHIVE_PATH="$PWD/build/iLiDAR.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/iLiDAR.app"

          echo "=== ARCHIVE CONTENTS ==="
          find "$ARCHIVE_PATH/Products" -maxdepth 4 -print

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iLiDAR.app not found"
            find "$ARCHIVE_PATH" -type d -name "*.app" -print
            exit 1
          fi

          echo "Application found!"
          file "$APP_PATH/iLiDAR"

          echo "=== BUNDLE IDENTIFIER ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/iLiDAR.xcarchive/Products/Applications/iLiDAR.app Payload/
          zip -r iLiDAR-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iLiDAR-unsigned-IPA
          path: iLiDAR-unsigned.ipa
          retention-days: 7
