
name: Build iLiDAR IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install --repo-update

      - name: Verify iLiDAR target
        run: |
          echo "=== WORKSPACE SCHEMES ==="
          xcodebuild -list -workspace iLiDAR.xcworkspace

          echo "=== PROJECT TARGETS ==="
          xcodebuild -list -project iLiDAR.xcodeproj

      - name: Build iLiDAR application
        run: |
          xcodebuild archive \
            -workspace iLiDAR.xcworkspace \
            -scheme iLiDAR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/iLiDAR.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify application
        run: |
          echo "=== APPLICATION FILES ==="
          find build/iLiDAR.xcarchive -type d -name "*.app" -print

          APP_PATH=$(find build/iLiDAR.xcarchive/Products/Applications -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iLiDAR.app not found"
            find build/iLiDAR.xcarchive -maxdepth 6 -print
            exit 1
          fi

          echo "SUCCESS: $APP_PATH"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/iLiDAR.xcarchive/Products/Applications -maxdepth 1 -type d -name "*.app" -print -quit)

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r iLiDAR-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iLiDAR-unsigned-IPA
          path: iLiDAR-unsigned.ipa
          retention-days: 7
